<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身体状态仪表盘 — 羽毛球职业训练系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--surface:#18181b;--surface-2:#27272a;--border:#3f3f46;--text:#fafafa;--text-2:#a1a1aa;--accent:#f43f5e;--accent-2:#fb7185;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--yellow:#eab308;--indigo:#6366f1}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
        .back{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center}
        .back a{color:var(--text-2);text-decoration:none;font-size:0.9rem}.back a:hover{color:var(--text)}
        .content{max-width:800px;margin:0 auto;padding:6rem 2rem 4rem}
        .badge{display:inline-block;padding:0.3rem 0.8rem;background:rgba(34,197,94,0.15);border-radius:4px;font-size:0.8rem;color:var(--green);font-family:'JetBrains Mono',monospace}
        h1{font-size:2.2rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3}
        .meta{color:var(--text-2);font-size:0.9rem;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
        h2{font-size:1.4rem;font-weight:700;margin:3rem 0 1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}
        p{margin-bottom:1rem;color:var(--text-2)}
        strong{color:var(--text)}
        .callout{background:var(--surface);border-left:3px solid var(--accent);padding:1.25rem 1.5rem;border-radius:0 8px 8px 0;margin:1.5rem 0}
        .callout p{margin:0;color:var(--text)}
        .callout.info{border-left-color:var(--blue)}
        .callout.success{border-left-color:var(--green)}
        .body-map{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;margin:1.5rem 0}
        .body-map-title{font-weight:600;margin-bottom:1rem}
        .body-parts{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
        .body-part{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;cursor:pointer;transition:all 0.2s}
        .body-part:hover{border-color:var(--accent)}
        .body-part.selected{border-color:var(--accent);background:rgba(233,63,94,0.1)}
        .body-part-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
        .body-part-name{font-weight:600}
        .body-part-status{width:12px;height:12px;border-radius:50%}
        .body-part-status.good{background:var(--green)}
        .body-part-status.warning{background:var(--yellow)}
        .body-part-status.bad{background:var(--accent)}
        .body-part-desc{font-size:0.85rem;color:var(--text-2)}
        .body-part-pain{font-size:0.8rem;color:var(--accent);margin-top:0.25rem}
        .add-status{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:1.5rem 0}
        .add-status-title{font-weight:600;margin-bottom:1rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
        .form-field{display:flex;flex-direction:column;gap:0.3rem}
        .form-field label{font-size:0.85rem;color:var(--text-2)}
        .form-field input,.form-field select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.6rem 0.8rem;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none}
        .form-field input:focus,.form-field select:focus{border-color:var(--accent)}
        .btn{background:var(--accent);color:white;border:none;border-radius:6px;padding:0.7rem 1.5rem;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .btn:hover{background:var(--accent-2)}
        .pain-scale{display:flex;gap:0.5rem;margin:1rem 0}
        .pain-level{flex:1;text-align:center;padding:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:0.85rem}
        .pain-level:hover{border-color:var(--accent)}
        .pain-level.selected{border-color:var(--accent);background:rgba(233,63,94,0.2)}
        .pain-level.p0{color:var(--green)}
        .pain-level.p1{color:var(--yellow)}
        .pain-level.p2{color:var(--orange)}
        .pain-level.p3{color:var(--accent)}
        .status-history{margin:1.5rem 0}
        .status-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin:0.5rem 0}
        .status-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
        .status-date{font-size:0.85rem;color:var(--text-2)}
        .status-overall{padding:0.25rem 0.75rem;border-radius:50px;font-size:0.75rem;font-weight:600}
        .status-overall.good{background:rgba(34,197,94,0.2);color:var(--green)}
        .status-overall.warning{background:rgba(234,179,8,0.2);color:var(--yellow)}
        .status-overall.bad{background:rgba(239,68,68,0.2);color:var(--accent)}
        .status-details{font-size:0.9rem;color:var(--text-2)}
        .cta{display:flex;gap:1rem;margin:3rem 0;flex-wrap:wrap}
        .cta a{flex:1;min-width:200px;padding:1rem;text-align:center;background:var(--accent);color:white;border-radius:8px;text-decoration:none;font-weight:600;transition:all 0.2s}
        .cta a:hover{background:var(--accent-2);transform:translateY(-2px)}
        .cta a.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
        .cta a.secondary:hover{background:var(--surface)}
        .next{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between}
        .next a{color:var(--accent);text-decoration:none;font-weight:500}
        .next a:hover{text-decoration:underline}
        @media(max-width:768px){
            .body-parts{grid-template-columns:1fr}
            .form-row{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <div class="back"><a href="../index.html">← 返回首页</a></div>
    <div class="content">
        <div class="badge">身体监控</div>
        <h1>身体状态仪表盘</h1>
        <div class="meta">追踪身体状态 · 识别问题 · 预防损伤</div>

        <div class="callout info">
            <p><strong>为什么监控身体状态？</strong>及时发现身体问题，预防运动损伤。当你感到某个部位不适时，记录下来，观察变化趋势。</p>
        </div>

        <h2>📊 当前身体状态</h2>
        <div class="body-map">
            <div class="body-map-title">点击部位查看详情</div>
            <div class="body-parts" id="body-parts">
                <div class="body-part" data-part="shoulder" onclick="selectPart('shoulder')">
                    <div class="body-part-header">
                        <div class="body-part-name">肩关节</div>
                        <div class="body-part-status good" id="status-shoulder"></div>
                    </div>
                    <div class="body-part-desc">击球稳定性</div>
                    <div class="body-part-pain" id="pain-shoulder"></div>
                </div>
                <div class="body-part" data-part="elbow" onclick="selectPart('elbow')">
                    <div class="body-part-header">
                        <div class="body-part-name">肘关节</div>
                        <div class="body-part-status good" id="status-elbow"></div>
                    </div>
                    <div class="body-part-desc">挥拍发力</div>
                    <div class="body-part-pain" id="pain-elbow"></div>
                </div>
                <div class="body-part" data-part="wrist" onclick="selectPart('wrist')">
                    <div class="body-part-header">
                        <div class="body-part-name">腕关节</div>
                        <div class="body-part-status good" id="status-wrist"></div>
                    </div>
                    <div class="body-part-desc">握拍控制</div>
                    <div class="body-part-pain" id="pain-wrist"></div>
                </div>
                <div class="body-part" data-part="back" onclick="selectPart('back')">
                    <div class="body-part-header">
                        <div class="body-part-name">腰背部</div>
                        <div class="body-part-status good" id="status-back"></div>
                    </div>
                    <div class="body-part-desc">核心稳定</div>
                    <div class="body-part-pain" id="pain-back"></div>
                </div>
                <div class="body-part" data-part="knee" onclick="selectPart('knee')">
                    <div class="body-part-header">
                        <div class="body-part-name">膝关节</div>
                        <div class="body-part-status good" id="status-knee"></div>
                    </div>
                    <div class="body-part-desc">步法移动</div>
                    <div class="body-part-pain" id="pain-knee"></div>
                </div>
                <div class="body-part" data-part="ankle" onclick="selectPart('ankle')">
                    <div class="body-part-header">
                        <div class="body-part-name">踝关节</div>
                        <div class="body-part-status good" id="status-ankle"></div>
                    </div>
                    <div class="body-part-desc">起跳落地</div>
                    <div class="body-part-pain" id="pain-ankle"></div>
                </div>
            </div>
        </div>

        <h2>➕ 记录身体状态</h2>
        <div class="add-status">
            <div class="add-status-title">今日身体状态</div>
            <div class="form-row">
                <div class="form-field">
                    <label>日期</label>
                    <input type="date" id="status-date">
                </div>
                <div class="form-field">
                    <label>整体状态</label>
                    <select id="overall-status">
                        <option value="good">良好</option>
                        <option value="warning">一般</option>
                        <option value="bad">较差</option>
                    </select>
                </div>
            </div>
            <div class="form-field" style="margin-bottom:1rem">
                <label>疼痛部位（如有）</label>
                <select id="pain-part">
                    <option value="">无疼痛</option>
                    <option value="shoulder">肩关节</option>
                    <option value="elbow">肘关节</option>
                    <option value="wrist">腕关节</option>
                    <option value="back">腰背部</option>
                    <option value="knee">膝关节</option>
                    <option value="ankle">踝关节</option>
                </select>
            </div>
            <div class="form-field" style="margin-bottom:1rem">
                <label>疼痛程度</label>
                <div class="pain-scale">
                    <div class="pain-level p0" onclick="selectPain(0)">0 无痛</div>
                    <div class="pain-level p1" onclick="selectPain(1)">1 轻微</div>
                    <div class="pain-level p2" onclick="selectPain(2)">2 中度</div>
                    <div class="pain-level p3" onclick="selectPain(3)">3 严重</div>
                </div>
            </div>
            <div class="form-field" style="margin-bottom:1rem">
                <label>备注</label>
                <input type="text" id="status-notes" placeholder="今天身体感觉如何...">
            </div>
            <button class="btn" onclick="addStatus()">保存记录</button>
        </div>

        <h2>📋 历史记录</h2>
        <div class="status-history" id="status-history">
            <!-- 历史记录将在这里显示 -->
        </div>

        <div class="callout" style="border-left-color:var(--yellow)">
            <p><strong>⚠️ 注意：</strong>如果疼痛程度达到2级以上，或持续超过3天，请立即停止训练并咨询专业人士。</p>
        </div>

        <div class="cta">
            <a href="20-error-correction.html">查看纠错指南</a>
            <a href="24-safety-guide.html" class="secondary">查看安全边界</a>
        </div>

        <div class="next">
            <a href="../index.html">← 返回首页</a>
            <a href="20-error-correction.html">纠错指南 →</a>
        </div>
    </div>

    <script>
        let selectedPart = '';
        let selectedPain = 0;
        let statuses = JSON.parse(localStorage.getItem('body-status') || '[]');

        // 初始化
        function init() {
            document.getElementById('status-date').value = new Date().toISOString().split('T')[0];
            renderHistory();
            updateBodyMap();
        }

        // 选择部位
        function selectPart(part) {
            selectedPart = part;
            document.querySelectorAll('.body-part').forEach(p => p.classList.remove('selected'));
            document.querySelector(`[data-part="${part}"]`).classList.add('selected');
            document.getElementById('pain-part').value = part;
        }

        // 选择疼痛程度
        function selectPain(level) {
            selectedPain = level;
            document.querySelectorAll('.pain-level').forEach(p => p.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        // 添加状态记录
        function addStatus() {
            const date = document.getElementById('status-date').value;
            const overall = document.getElementById('overall-status').value;
            const painPart = document.getElementById('pain-part').value;
            const notes = document.getElementById('status-notes').value;
            
            const status = {
                id: Date.now(),
                date: date,
                overall: overall,
                painPart: painPart,
                painLevel: selectedPain,
                notes: notes,
                createdAt: new Date().toISOString()
            };
            
            statuses.push(status);
            localStorage.setItem('body-status', JSON.stringify(statuses));
            
            // 清空表单
            document.getElementById('pain-part').value = '';
            document.getElementById('status-notes').value = '';
            selectedPain = 0;
            document.querySelectorAll('.pain-level').forEach(p => p.classList.remove('selected'));
            
            renderHistory();
            updateBodyMap();
        }

        // 渲染历史记录
        function renderHistory() {
            const recentStatuses = statuses.slice(-10).reverse();
            const listHtml = recentStatuses.map(s => `
                <div class="status-item">
                    <div class="status-header">
                        <div class="status-date">${s.date}</div>
                        <div class="status-overall ${s.overall}">${s.overall === 'good' ? '良好' : s.overall === 'warning' ? '一般' : '较差'}</div>
                    </div>
                    <div class="status-details">
                        ${s.painPart ? `疼痛部位：${getPartName(s.painPart)} · 程度：${s.painLevel}级` : '无疼痛'}
                        ${s.notes ? ` · ${s.notes}` : ''}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('status-history').innerHTML = listHtml || '<p style="color:var(--text-2);text-align:center">暂无记录</p>';
        }

        // 获取部位名称
        function getPartName(part) {
            const names = {
                shoulder: '肩关节',
                elbow: '肘关节',
                wrist: '腕关节',
                back: '腰背部',
                knee: '膝关节',
                ankle: '踝关节'
            };
            return names[part] || part;
        }

        // 更新身体地图
        function updateBodyMap() {
            const parts = ['shoulder', 'elbow', 'wrist', 'back', 'knee', 'ankle'];
            parts.forEach(part => {
                const partStatuses = statuses.filter(s => s.painPart === part);
                const recentStatus = partStatuses[partStatuses.length - 1];
                
                const statusEl = document.getElementById(`status-${part}`);
                const painEl = document.getElementById(`pain-${part}`);
                
                if (recentStatus) {
                    if (recentStatus.painLevel === 0) {
                        statusEl.className = 'body-part-status good';
                        painEl.textContent = '';
                    } else if (recentStatus.painLevel === 1) {
                        statusEl.className = 'body-part-status warning';
                        painEl.textContent = `疼痛：${recentStatus.painLevel}级`;
                    } else {
                        statusEl.className = 'body-part-status bad';
                        painEl.textContent = `疼痛：${recentStatus.painLevel}级`;
                    }
                } else {
                    statusEl.className = 'body-part-status good';
                    painEl.textContent = '';
                }
            });
        }

        init();
    </script>
</body>
</html>
