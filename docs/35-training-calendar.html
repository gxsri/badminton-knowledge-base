<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>训练日历 — 羽毛球职业训练系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--surface:#18181b;--surface-2:#27272a;--border:#3f3f46;--text:#fafafa;--text-2:#a1a1aa;--accent:#f43f5e;--accent-2:#fb7185;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--yellow:#eab308;--indigo:#6366f1}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
        .back{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center}
        .back a{color:var(--text-2);text-decoration:none;font-size:0.9rem}.back a:hover{color:var(--text)}
        .content{max-width:800px;margin:0 auto;padding:6rem 2rem 4rem}
        .badge{display:inline-block;padding:0.3rem 0.8rem;background:rgba(59,130,246,0.15);border-radius:4px;font-size:0.8rem;color:var(--blue);font-family:'JetBrains Mono',monospace}
        h1{font-size:2.2rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3}
        .meta{color:var(--text-2);font-size:0.9rem;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
        h2{font-size:1.4rem;font-weight:700;margin:3rem 0 1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}
        p{margin-bottom:1rem;color:var(--text-2)}
        strong{color:var(--text)}
        .callout{background:var(--surface);border-left:3px solid var(--accent);padding:1.25rem 1.5rem;border-radius:0 8px 8px 0;margin:1.5rem 0}
        .callout p{margin:0;color:var(--text)}
        .callout.info{border-left-color:var(--blue)}
        .callout.success{border-left-color:var(--green)}
        .calendar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:1.5rem 0}
        .calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
        .calendar-title{font-weight:600;font-size:1.1rem}
        .calendar-nav{display:flex;gap:0.5rem}
        .calendar-nav button{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:0.5rem 1rem;color:var(--text);cursor:pointer;font-size:0.9rem}
        .calendar-nav button:hover{background:var(--accent);border-color:var(--accent)}
        .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0.25rem}
        .calendar-day{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.5rem;text-align:center;min-height:60px;font-size:0.85rem}
        .calendar-day.today{border-color:var(--accent);background:rgba(233,63,94,0.1)}
        .calendar-day.has-training{border-color:var(--green);background:rgba(34,197,94,0.1)}
        .calendar-day.has-rest{border-color:var(--yellow);background:rgba(234,179,8,0.1)}
        .calendar-day-header{font-weight:600;color:var(--text-2);font-size:0.75rem;padding:0.25rem}
        .calendar-day-num{font-weight:600;margin-bottom:0.25rem}
        .calendar-day-type{font-size:0.7rem;color:var(--text-2)}
        .add-training{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:1.5rem 0}
        .add-training-title{font-weight:600;margin-bottom:1rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
        .form-field{display:flex;flex-direction:column;gap:0.3rem}
        .form-field label{font-size:0.85rem;color:var(--text-2)}
        .form-field input,.form-field select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.6rem 0.8rem;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none}
        .form-field input:focus,.form-field select:focus{border-color:var(--accent)}
        .btn{background:var(--accent);color:white;border:none;border-radius:6px;padding:0.7rem 1.5rem;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .btn:hover{background:var(--accent-2)}
        .btn-secondary{background:var(--surface-2);border:1px solid var(--border)}
        .btn-secondary:hover{background:var(--surface)}
        .training-list{margin:1.5rem 0}
        .training-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;margin:0.5rem 0;display:flex;justify-content:space-between;align-items:center}
        .training-info{flex:1}
        .training-date{font-size:0.8rem;color:var(--text-2)}
        .training-type{font-weight:600;margin-bottom:0.25rem}
        .training-desc{font-size:0.85rem;color:var(--text-2)}
        .training-status{padding:0.25rem 0.75rem;border-radius:50px;font-size:0.75rem;font-weight:600}
        .training-status.completed{background:rgba(34,197,94,0.2);color:var(--green)}
        .training-status.pending{background:rgba(234,179,8,0.2);color:var(--yellow)}
        .training-status.missed{background:rgba(239,68,68,0.2);color:var(--accent)}
        .cta{display:flex;gap:1rem;margin:3rem 0;flex-wrap:wrap}
        .cta a{flex:1;min-width:200px;padding:1rem;text-align:center;background:var(--accent);color:white;border-radius:8px;text-decoration:none;font-weight:600;transition:all 0.2s}
        .cta a:hover{background:var(--accent-2);transform:translateY(-2px)}
        .cta a.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
        .cta a.secondary:hover{background:var(--surface)}
        .next{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between}
        .next a{color:var(--accent);text-decoration:none;font-weight:500}
        .next a:hover{text-decoration:underline}
        .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.5rem 0}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;text-align:center}
        .stat-num{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;color:var(--accent)}
        .stat-label{font-size:0.8rem;color:var(--text-2);margin-top:0.25rem}
        @media(max-width:768px){
            .form-row{grid-template-columns:1fr}
            .stats-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <div class="back"><a href="../index.html">← 返回首页</a></div>
    <div class="content">
        <div class="badge">P1工具</div>
        <h1>训练日历</h1>
        <div class="meta">记录训练 · 追踪进度 · 保持动力</div>

        <div class="callout info">
            <p><strong>为什么需要训练日历？</strong>可视化训练安排，帮助你坚持训练计划。记录每次训练，追踪进步，保持动力。</p>
        </div>

        <h2>📊 本月统计</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num" id="stat-total">0</div>
                <div class="stat-label">本月训练次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-hours">0</div>
                <div class="stat-label">总训练小时</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-streak">0</div>
                <div class="stat-label">连续天数</div>
            </div>
        </div>

        <h2>📅 训练日历</h2>
        <div class="calendar">
            <div class="calendar-header">
                <div class="calendar-title" id="calendar-title">2026年6月</div>
                <div class="calendar-nav">
                    <button onclick="prevMonth()">← 上月</button>
                    <button onclick="nextMonth()">下月 →</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- 日历将在这里生成 -->
            </div>
        </div>

        <h2>➕ 添加训练记录</h2>
        <div class="add-training">
            <div class="add-training-title">记录今天的训练</div>
            <div class="form-row">
                <div class="form-field">
                    <label>训练日期</label>
                    <input type="date" id="training-date">
                </div>
                <div class="form-field">
                    <label>训练类型</label>
                    <select id="training-type">
                        <option value="技术">技术训练</option>
                        <option value="体能">体能训练</option>
                        <option value="力量">力量训练</option>
                        <option value="步法">步法训练</option>
                        <option value="比赛">比赛/对抗</option>
                        <option value="恢复">恢复训练</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>训练时长（分钟）</label>
                    <input type="number" id="training-duration" placeholder="60">
                </div>
                <div class="form-field">
                    <label>训练状态</label>
                    <select id="training-status">
                        <option value="completed">完成</option>
                        <option value="pending">计划中</option>
                        <option value="missed">错过</option>
                    </select>
                </div>
            </div>
            <div class="form-field" style="margin-bottom:1rem">
                <label>训练备注（可选）</label>
                <input type="text" id="training-notes" placeholder="今天练了什么，感觉如何...">
            </div>
            <button class="btn" onclick="addTraining()">添加记录</button>
        </div>

        <h2>📋 最近训练记录</h2>
        <div class="training-list" id="training-list">
            <!-- 训练记录将在这里显示 -->
        </div>

        <div class="cta">
            <a href="00-quickstart.html">开始训练</a>
            <a href="30-achievements.html" class="secondary">查看成就系统</a>
        </div>

        <div class="next">
            <a href="../index.html">← 返回首页</a>
            <a href="30-achievements.html">成就系统 →</a>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let trainings = JSON.parse(localStorage.getItem('training-calendar') || '[]');

        // 初始化日历
        function initCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('calendar-title').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            
            let html = '';
            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
            
            // 星期标题
            dayNames.forEach(day => {
                html += `<div class="calendar-day-header">${day}</div>`;
            });
            
            // 空白天数
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day"></div>';
            }
            
            // 日期
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                const dayTrainings = trainings.filter(t => t.date === dateStr);
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (dayTrainings.length > 0) {
                    const hasCompleted = dayTrainings.some(t => t.status === 'completed');
                    const hasMissed = dayTrainings.some(t => t.status === 'missed');
                    if (hasCompleted) classes += ' has-training';
                    else if (hasMissed) classes += ' has-rest';
                }
                
                html += `<div class="${classes}" onclick="showDayDetails('${dateStr}')">
                    <div class="calendar-day-num">${day}</div>
                    ${dayTrainings.length > 0 ? `<div class="calendar-day-type">${dayTrainings.length}次训练</div>` : ''}
                </div>`;
            }
            
            document.getElementById('calendar-grid').innerHTML = html;
            updateStats();
        }

        // 上个月
        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            initCalendar();
        }

        // 下个月
        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            initCalendar();
        }

        // 添加训练
        function addTraining() {
            const date = document.getElementById('training-date').value;
            const type = document.getElementById('training-type').value;
            const duration = document.getElementById('training-duration').value;
            const status = document.getElementById('training-status').value;
            const notes = document.getElementById('training-notes').value;
            
            if (!date || !duration) {
                alert('请填写日期和时长');
                return;
            }
            
            const training = {
                id: Date.now(),
                date: date,
                type: type,
                duration: parseInt(duration),
                status: status,
                notes: notes,
                createdAt: new Date().toISOString()
            };
            
            trainings.push(training);
            localStorage.setItem('training-calendar', JSON.stringify(trainings));
            
            // 清空表单
            document.getElementById('training-duration').value = '';
            document.getElementById('training-notes').value = '';
            
            initCalendar();
            renderTrainingList();
        }

        // 显示日期详情
        function showDayDetails(dateStr) {
            const dayTrainings = trainings.filter(t => t.date === dateStr);
            if (dayTrainings.length === 0) {
                alert(`${dateStr} 没有训练记录`);
                return;
            }
            
            let msg = `${dateStr} 的训练记录：\n\n`;
            dayTrainings.forEach(t => {
                msg += `• ${t.type} - ${t.duration}分钟 - ${t.status === 'completed' ? '已完成' : t.status === 'pending' ? '计划中' : '已错过'}\n`;
                if (t.notes) msg += `  备注：${t.notes}\n`;
            });
            alert(msg);
        }

        // 更新统计
        function updateStats() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthTrainings = trainings.filter(t => {
                const d = new Date(t.date);
                return d.getFullYear() === year && d.getMonth() === month;
            });
            
            const total = monthTrainings.length;
            const hours = Math.round(monthTrainings.reduce((sum, t) => sum + t.duration, 0) / 60);
            
            // 计算连续天数
            let streak = 0;
            const today = new Date();
            for (let i = 0; i < 365; i++) {
                const checkDate = new Date(today);
                checkDate.setDate(checkDate.getDate() - i);
                const dateStr = checkDate.toISOString().split('T')[0];
                const hasTraining = trainings.some(t => t.date === dateStr && t.status === 'completed');
                if (hasTraining) {
                    streak++;
                } else {
                    break;
                }
            }
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-hours').textContent = hours;
            document.getElementById('stat-streak').textContent = streak;
        }

        // 渲染训练列表
        function renderTrainingList() {
            const recentTrainings = trainings.slice(-10).reverse();
            const listHtml = recentTrainings.map(t => `
                <div class="training-item">
                    <div class="training-info">
                        <div class="training-date">${t.date}</div>
                        <div class="training-type">${t.type}</div>
                        <div class="training-desc">${t.duration}分钟 ${t.notes ? '- ' + t.notes : ''}</div>
                    </div>
                    <div class="training-status ${t.status}">${t.status === 'completed' ? '已完成' : t.status === 'pending' ? '计划中' : '已错过'}</div>
                </div>
            `).join('');
            
            document.getElementById('training-list').innerHTML = listHtml || '<p style="color:var(--text-2);text-align:center">暂无训练记录</p>';
        }

        // 初始化
        document.getElementById('training-date').value = new Date().toISOString().split('T')[0];
        initCalendar();
        renderTrainingList();
    </script>
</body>
</html>
