<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="700" height="550">
  <rect width="700" height="550" fill="#0f172a" rx="8"/>
  <text x="350" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">上交叉综合征——圆肩+头前引</text>
<ellipse cx="350" cy="240" rx="75" ry="170" fill="none" stroke="#475569" stroke-width="1.5"/><ellipse cx="350" cy="120" rx="55" ry="65" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="300" y="175" width="80" height="35" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/><text x="340" y="192" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">胸大肌(紧)</text><rect x="315" y="90" width="90" height="35" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/><text x="360" y="107" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">上斜方肌(紧)</text><rect x="400" y="115" width="90" height="35" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/><text x="445" y="132" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="middle">深层颈屈肌(弱)</text><rect x="390" y="200" width="90" height="35" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/><text x="435" y="217" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="middle">中下斜方肌(弱)</text><path d="M 350 150 Q 290 175 270 185" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#a)"/><text x="260" y="170" fill="#ef4444" font-family="sans-serif" font-size="10">圆肩→</text><path d="M 350 65 Q 370 70 395 90" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#a)"/><text x="375" y="75" fill="#ef4444" font-family="sans-serif" font-size="10">头前引→</text><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker></defs><rect x="30" y="400" width="640" height="130" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="40" y="420" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">表现与后果：</text><text x="40" y="445+0" fill="#94a3b8" font-family="sans-serif" font-size="10">• 胸大肌短缩紧张 → 肩活动度下降</text><text x="40" y="445+22" fill="#94a3b8" font-family="sans-serif" font-size="10">• 上斜方肌紧张 → 架拍耸肩</text><text x="40" y="445+44" fill="#94a3b8" font-family="sans-serif" font-size="10">• 深层颈屈肌无力 → 头前引</text><text x="40" y="445+66" fill="#94a3b8" font-family="sans-serif" font-size="10">• 中下斜方肌无力 → 肩胛骨不稳</text><text x="40" y="445" fill="#94a3b8" font-family="sans-serif" font-size="10">• 胸大肌短缩紧张 → 肩活动度下降</text><text x="40" y="467" fill="#94a3b8" font-family="sans-serif" font-size="10">• 上斜方肌紧张 → 架拍耸肩</text><text x="40" y="489" fill="#94a3b8" font-family="sans-serif" font-size="10">• 深层颈屈肌无力 → 头前引</text><text x="40" y="511" fill="#94a3b8" font-family="sans-serif" font-size="10">• 中下斜方肌无力 → 肩胛骨不稳</text></svg>