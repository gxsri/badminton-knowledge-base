    <rect x="210" y="185" width="75" height="35" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/><text x="247" y="199" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">斜方肌(上束)</text><rect x="175" y="220" width="95" height="40" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/><text x="222" y="234" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle">斜方肌(中下束)</text><rect x="135" y="215" width="45" height="25" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/><text x="157" y="229" fill="#3b82f6" font-family="sans-serif" font-size="8" text-anchor="middle">三角肌(后束)</text><rect x="180" y="210" width="30" height="30" rx="4" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1"/><text x="195" y="224" fill="#a78bfa" font-family="sans-serif" font-size="8" text-anchor="middle">冈下肌+小圆肌</text><rect x="200" y="235" width="50" height="30" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/><text x="225" y="249" fill="#22c55e" font-family="sans-serif" font-size="8" text-anchor="middle">菱形肌</text><rect x="145" y="260" width="70" height="70" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/><text x="180" y="274" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">背阔肌</text><rect x="230" y="270" width="40" height="100" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/><text x="250" y="284" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle">竖脊肌</text><rect x="185" y="340" width="40" height="30" rx="4" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/><text x="205" y="354" fill="#f97316" font-family="sans-serif" font-size="8" text-anchor="middle">腰方肌</text><rect x="175" y="380" width="100" height="55" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/><text x="225" y="394" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">臀大肌</text><rect x="160" y="360" width="50" height="30" rx="4" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1"/><text x="185" y="374" fill="#a78bfa" font-family="sans-serif" font-size="8" text-anchor="middle">臀中肌</text><rect x="195" y="410" width="100" height="95" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/><text x="245" y="424" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle">腘绳肌</text><rect x="195" y="630" width="35" height="80" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/><text x="212" y="644" fill="#22c55e" font-family="sans-serif" font-size="8" text-anchor="middle">腓肠肌</text><rect x="185" y="690" width="30" height="50" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/><text x="200" y="704" fill="#3b82f6" font-family="sans-serif" font-size="8" text-anchor="middle">比目鱼肌</text><rect x="200" y="750" width="20" height="40" rx="4" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/><text x="210" y="764" fill="#f97316" font-family="sans-serif" font-size="8" text-anchor="middle">跟腱</text><text x="370" y="230" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="start">1. 斜方肌(中下束) - 肩胛骨稳定</text><text x="370" y="245" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="start">2. 背阔肌 - 杀球动力源</text><text x="370" y="260" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="start">3. 竖脊肌 - 维持直立</text><text x="370" y="275" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="start">4. 臀大肌 - 蹬地驱动</text><text x="370" y="290" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="start">5. 腘绳肌 - 急停刹车</text><text x="370" y="305" fill="#22c55e" font-family="sans-serif" font-size="9" text-anchor="start">6. 腓肠肌 - 弹性储能</text></svg>