<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <rect width="1000" height="650" fill="#0f172a" rx="8"/>
  <text x="500" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">激痛点形成机制——能量危机恶性循环</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="400" y="40" width="200" height="60" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><text x="500" y="64" fill="#ef4444" font-family="sans-serif" font-size="11" text-anchor="middle">肌纤维过度负荷</text><text x="500" y="82" fill="#ef4444" font-family="sans-serif" font-size="11" text-anchor="middle">(急性/反复/缩短位)</text><line x1="500" y1="100" x2="500" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="140" width="200" height="60" rx="6" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1.5"/><text x="500" y="164" fill="#f97316" font-family="sans-serif" font-size="11" text-anchor="middle">钙离子调节异常</text><text x="500" y="182" fill="#f97316" font-family="sans-serif" font-size="11" text-anchor="middle">→ 持续收缩</text><line x1="500" y1="200" x2="500" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="240" width="200" height="60" rx="6" fill="#eab308" fill-opacity="0.12" stroke="#eab308" stroke-width="1.5"/><text x="500" y="264" fill="#eab308" font-family="sans-serif" font-size="11" text-anchor="middle">毛细血管被压</text><text x="500" y="282" fill="#eab308" font-family="sans-serif" font-size="11" text-anchor="middle">→ 缺血+缺氧</text><line x1="500" y1="300" x2="500" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="340" width="200" height="60" rx="6" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5"/><text x="500" y="364" fill="#22c55e" font-family="sans-serif" font-size="11" text-anchor="middle">ATP不足→钙泵失灵</text><text x="500" y="382" fill="#22c55e" font-family="sans-serif" font-size="11" text-anchor="middle">→ 更无法放松</text><line x1="500" y1="400" x2="500" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="440" width="200" height="60" rx="6" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1.5"/><text x="500" y="464" fill="#06b6d4" font-family="sans-serif" font-size="11" text-anchor="middle">代谢废物堆积</text><text x="500" y="482" fill="#06b6d4" font-family="sans-serif" font-size="11" text-anchor="middle">→ 刺激痛觉神经</text><line x1="500" y1="500" x2="500" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="400" y="540" width="200" height="60" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1.5"/><text x="500" y="564" fill="#a78bfa" font-family="sans-serif" font-size="11" text-anchor="middle">脊髓异常兴奋</text><text x="500" y="582" fill="#a78bfa" font-family="sans-serif" font-size="11" text-anchor="middle">→ 更多肌纤维卷入</text><line x1="400" y1="540" x2="400" y2="100" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/><rect x="150" y="610" width="700" height="30" rx="4" fill="#334155" fill-opacity="0.5"/><text x="500" y="630" fill="#f87171" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">总结：激痛点 = 一小团肌纤维因能量危机而无法放松</text></svg>