<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="在全部文档中搜索训练内容">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='88'%3E🏸%3C/text%3E%3C/svg%3E">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全文搜索 — 羽毛球职业训练系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--surface:#18181b;--surface-2:#27272a;--border:#3f3f46;--text:#fafafa;--text-2:#a1a1aa;--accent:#f43f5e;--accent-2:#fb7185;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--yellow:#eab308;--indigo:#6366f1}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
        .back{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center}
        .back a{color:var(--text-2);text-decoration:none;font-size:0.9rem}.back a:hover{color:var(--text)}
        .content{max-width:800px;margin:0 auto;padding:6rem 2rem 4rem}
        .badge{display:inline-block;padding:0.3rem 0.8rem;background:rgba(59,130,246,0.15);border-radius:4px;font-size:0.8rem;color:var(--blue);font-family:'JetBrains Mono',monospace}
        h1{font-size:2.2rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3}
        .meta{color:var(--text-2);font-size:0.9rem;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
        h2{font-size:1.4rem;font-weight:700;margin:3rem 0 1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}
        p{margin-bottom:1rem;color:var(--text-2)}
        strong{color:var(--text)}
        .search-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:1.5rem 0}
        .search-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem 1.25rem;color:var(--text);font-size:1.1rem;font-family:inherit;outline:none;transition:border 0.2s}
        .search-input:focus{border-color:var(--accent)}
        .search-input::placeholder{color:var(--text-2)}
        .search-hints{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:1rem}
        .search-hint{padding:0.4rem 0.8rem;background:var(--surface-2);border-radius:50px;font-size:0.8rem;color:var(--text-2);cursor:pointer;transition:all 0.2s}
        .search-hint:hover{background:var(--accent);color:white}
        .search-results{margin:2rem 0}
        .result-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin:1rem 0;text-decoration:none;color:var(--text);display:block;transition:all 0.2s}
        .result-item:hover{border-color:var(--accent);transform:translateY(-2px)}
        .result-num{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--accent);margin-bottom:0.25rem}
        .result-title{font-weight:600;margin-bottom:0.25rem}
        .result-desc{font-size:0.85rem;color:var(--text-2)}
        .result-tags{display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap}
        .result-tag{padding:0.15rem 0.5rem;background:var(--surface-2);border-radius:4px;font-size:0.7rem;color:var(--text-2)}
        .no-results{text-align:center;padding:3rem;color:var(--text-2)}
        .no-results-icon{font-size:3rem;margin-bottom:1rem}
        .category-section{margin:2rem 0}
        .category-title{font-weight:600;margin-bottom:1rem;color:var(--accent-2)}
        .cta{display:flex;gap:1rem;margin:3rem 0;flex-wrap:wrap}
        .cta a{flex:1;min-width:200px;padding:1rem;text-align:center;background:var(--accent);color:white;border-radius:8px;text-decoration:none;font-weight:600;transition:all 0.2s}
        .cta a:hover{background:var(--accent-2);transform:translateY(-2px)}
        .cta a.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
        .cta a.secondary:hover{background:var(--surface)}
        .next{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between}
        .next a{color:var(--accent);text-decoration:none;font-weight:500}
        .next a:hover{text-decoration:underline}
            @media print {
            :root { --bg:#ffffff; --surface:#f4f4f5; --surface-2:#e4e4e7; --border:#d4d4d8; --text:#18181b; --text-2:#3f3f46; --accent:#be123c; --accent-2:#9f1239; --green:#15803d; --blue:#1d4ed8; --purple:#6d28d9; --orange:#c2410c; --yellow:#a16207; --indigo:#4338ca; }
            .back, .next, .cta, .search-hints, .search-box, .fitness-actions, nav { display: none !important; }
            body { background: #fff; }
            .content, .section, .hero-content { max-width: 100%; }
            a { color: inherit; text-decoration: none; }
        }
    </style>
</head>
<body>
    <div class="back"><a href="../index.html">← 返回首页</a></div>
    <div class="content">
        <div class="badge">搜索</div>
        <h1>搜索内容</h1>
        <div class="meta">登记表驱动 · 覆盖全部 <span id="doc-count">—</span> 篇文档</div>

        <div class="search-box">
            <input type="text" class="search-input" placeholder="输入关键词搜索...（如：高远球、深蹲、健身、球路）" id="searchInput" oninput="performSearch()">
            <div class="search-hints">
                <span class="search-hint" onclick="searchFor('高远球')">高远球</span>
                <span class="search-hint" onclick="searchFor('杀球')">杀球</span>
                <span class="search-hint" onclick="searchFor('步法')">步法</span>
                <span class="search-hint" onclick="searchFor('深蹲')">深蹲</span>
                <span class="search-hint" onclick="searchFor('健身')">健身</span>
                <span class="search-hint" onclick="searchFor('球路')">球路</span>
                <span class="search-hint" onclick="searchFor('营养')">营养</span>
                <span class="search-hint" onclick="searchFor('恢复')">恢复</span>
                <span class="search-hint" onclick="searchFor('心理')">心理</span>
                <span class="search-hint" onclick="searchFor('伤病')">伤病</span>
                <span class="search-hint" onclick="searchFor('比赛')">比赛</span>
            </div>
        </div>

        <div class="search-results" id="searchResults">
            <!-- 搜索结果将在这里显示 -->
        </div>

        <div class="category-section" id="allContent" style="display:none">
            <div class="category-title">所有内容（按分组浏览）</div>
            <div id="allContentList"></div>
        </div>

        <div class="cta">
            <a href="00-quickstart.html">快速开始</a>
            <a href="../index.html" class="secondary">返回首页</a>
        </div>

        <div class="next">
            <a href="../index.html">← 返回首页</a>
            <a href="00-quickstart.html">快速开始 →</a>
        </div>
    </div>

    <script src="../docs-data.js"></script>
    <script>
        // 文档数据：统一登记表 docs-data.js（与首页同一来源）
        const DOCS = window.DOCS_DATA ? window.DOCS_DATA.docs : [];
        const GROUPS = window.DOCS_DATA ? window.DOCS_DATA.groups : [];
        const GROUP_NAME = {};
        GROUPS.forEach(g => { GROUP_NAME[g.key] = g.name; });

        function docCard(doc, query) {
            const hl = (t) => query ? highlightText(t, query) : t;
            const tags = doc.tags.slice(0, 3).map(tag => '<span class="result-tag">' + hl(tag) + '</span>').join('');
            return '<a href="' + doc.file + '" class="result-item">' +
                '<div class="result-num">' + doc.num + ' · ' + (GROUP_NAME[doc.group] || doc.group) + '</div>' +
                '<div class="result-title">' + hl(doc.title) + '</div>' +
                '<div class="result-desc">' + hl(doc.desc) + '</div>' +
                '<div class="result-tags">' + tags + '</div></a>';
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            const allContent = document.getElementById('allContent');

            if (query === '') {
                resultsContainer.innerHTML = '';
                allContent.style.display = 'none';
                return;
            }

            const results = DOCS.filter(doc => {
                return doc.title.toLowerCase().includes(query) ||
                       doc.desc.toLowerCase().includes(query) ||
                       doc.tags.some(tag => tag.toLowerCase().includes(query));
            });

            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <p>没有找到相关内容</p>
                        <p style="font-size:0.85rem">尝试其他关键词，如：高远球、深蹲、健身、营养</p>
                    </div>
                `;
                allContent.style.display = 'none';
                return;
            }

            resultsContainer.innerHTML = results.map(d => docCard(d, query)).join('');
            allContent.style.display = 'none';
        }

        // 高亮搜索关键词
        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            return text.replace(regex, '<strong style="color:var(--accent)">$1</strong>');
        }

        // 快捷搜索
        function searchFor(query) {
            document.getElementById('searchInput').value = query;
            performSearch();
        }

        // 页面加载：显示全部内容（按登记表分组顺序）
        window.onload = function () {
            const count = document.getElementById('doc-count');
            if (count) count.textContent = DOCS.length;

            const list = document.getElementById('allContentList');
            const parts = [];
            for (const g of GROUPS) {
                const docs = DOCS.filter(d => d.group === g.key);
                if (!docs.length) continue;
                parts.push('<div style="margin:1.5rem 0"><div class="category-title">' + g.name + ' · ' + g.desc + '</div>');
                parts.push(docs.map(d => docCard(d, '')).join(''));
                parts.push('</div>');
            }
            list.innerHTML = parts.join('');
            document.getElementById('allContent').style.display = 'block';
        };
    </script>
</body>
</html>
