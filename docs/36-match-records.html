<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比赛记录 — 羽毛球职业训练系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--surface:#18181b;--surface-2:#27272a;--border:#3f3f46;--text:#fafafa;--text-2:#a1a1aa;--accent:#f43f5e;--accent-2:#fb7185;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--yellow:#eab308;--indigo:#6366f1}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
        .back{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center}
        .back a{color:var(--text-2);text-decoration:none;font-size:0.9rem}.back a:hover{color:var(--text)}
        .content{max-width:800px;margin:0 auto;padding:6rem 2rem 4rem}
        .badge{display:inline-block;padding:0.3rem 0.8rem;background:rgba(249,115,22,0.15);border-radius:4px;font-size:0.8rem;color:var(--orange);font-family:'JetBrains Mono',monospace}
        h1{font-size:2.2rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3}
        .meta{color:var(--text-2);font-size:0.9rem;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
        h2{font-size:1.4rem;font-weight:700;margin:3rem 0 1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}
        p{margin-bottom:1rem;color:var(--text-2)}
        strong{color:var(--text)}
        .callout{background:var(--surface);border-left:3px solid var(--accent);padding:1.25rem 1.5rem;border-radius:0 8px 8px 0;margin:1.5rem 0}
        .callout p{margin:0;color:var(--text)}
        .callout.info{border-left-color:var(--blue)}
        .callout.success{border-left-color:var(--green)}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.5rem 0}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;text-align:center}
        .stat-num{font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:700;color:var(--accent)}
        .stat-label{font-size:0.8rem;color:var(--text-2);margin-top:0.25rem}
        .add-match{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:1.5rem 0}
        .add-match-title{font-weight:600;margin-bottom:1rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
        .form-field{display:flex;flex-direction:column;gap:0.3rem}
        .form-field label{font-size:0.85rem;color:var(--text-2)}
        .form-field input,.form-field select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.6rem 0.8rem;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none}
        .form-field input:focus,.form-field select:focus{border-color:var(--accent)}
        .btn{background:var(--accent);color:white;border:none;border-radius:6px;padding:0.7rem 1.5rem;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .btn:hover{background:var(--accent-2)}
        .match-list{margin:1.5rem 0}
        .match-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:1rem 0}
        .match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
        .match-date{font-size:0.85rem;color:var(--text-2)}
        .match-result{padding:0.25rem 0.75rem;border-radius:50px;font-size:0.8rem;font-weight:600}
        .match-result.win{background:rgba(34,197,94,0.2);color:var(--green)}
        .match-result.loss{background:rgba(239,68,68,0.2);color:var(--accent)}
        .match-result.draw{background:rgba(234,179,8,0.2);color:var(--yellow)}
        .match-players{font-size:1.1rem;font-weight:600;margin-bottom:0.5rem}
        .match-score{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:var(--accent);margin-bottom:0.5rem}
        .match-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin-top:1rem}
        .match-stat{background:var(--bg);border-radius:6px;padding:0.75rem;text-align:center}
        .match-stat-value{font-weight:600}
        .match-stat-label{font-size:0.75rem;color:var(--text-2)}
        .match-notes{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);font-size:0.9rem;color:var(--text-2)}
        .cta{display:flex;gap:1rem;margin:3rem 0;flex-wrap:wrap}
        .cta a{flex:1;min-width:200px;padding:1rem;text-align:center;background:var(--accent);color:white;border-radius:8px;text-decoration:none;font-weight:600;transition:all 0.2s}
        .cta a:hover{background:var(--accent-2);transform:translateY(-2px)}
        .cta a.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
        .cta a.secondary:hover{background:var(--surface)}
        .next{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between}
        .next a{color:var(--accent);text-decoration:none;font-weight:500}
        .next a:hover{text-decoration:underline}
        @media(max-width:768px){
            .form-row{grid-template-columns:1fr}
            .stats-grid{grid-template-columns:repeat(2,1fr)}
        }
    </style>
</head>
<body>
    <div class="back"><a href="../index.html">← 返回首页</a></div>
    <div class="content">
        <div class="badge">比赛数据</div>
        <h1>比赛记录</h1>
        <div class="meta">记录每场比赛 · 分析表现 · 持续进步</div>

        <div class="callout info">
            <p><strong>为什么记录比赛？</strong>比赛是检验训练成果的最佳方式。通过记录和分析比赛数据，你可以发现自己的优势和不足，为下一阶段训练提供方向。</p>
        </div>

        <h2>📊 比赛统计</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num" id="stat-matches">0</div>
                <div class="stat-label">总比赛场次</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-win-rate">0%</div>
                <div class="stat-label">胜率</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-win">0</div>
                <div class="stat-label">胜场</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-loss">0</div>
                <div class="stat-label">负场</div>
            </div>
        </div>

        <h2>➕ 添加比赛记录</h2>
        <div class="add-match">
            <div class="add-match-title">记录比赛</div>
            <div class="form-row">
                <div class="form-field">
                    <label>比赛日期</label>
                    <input type="date" id="match-date">
                </div>
                <div class="form-field">
                    <label>比赛结果</label>
                    <select id="match-result">
                        <option value="win">胜利</option>
                        <option value="loss">失败</option>
                        <option value="draw">平局</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>对手姓名</label>
                    <input type="text" id="match-opponent" placeholder="对手姓名">
                </div>
                <div class="form-field">
                    <label>比赛比分</label>
                    <input type="text" id="match-score" placeholder="如：21-15, 21-18">
                </div>
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label>比赛时长（分钟）</label>
                    <input type="number" id="match-duration" placeholder="45">
                </div>
                <div class="form-field">
                    <label>比赛类型</label>
                    <select id="match-type">
                        <option value="单打">单打</option>
                        <option value="双打">双打</option>
                        <option value="混双">混双</option>
                    </select>
                </div>
            </div>
            <div class="form-field" style="margin-bottom:1rem">
                <label>比赛总结（可选）</label>
                <input type="text" id="match-notes" placeholder="今天的比赛表现如何...">
            </div>
            <button class="btn" onclick="addMatch()">添加记录</button>
        </div>

        <h2>📋 比赛记录</h2>
        <div class="match-list" id="match-list">
            <!-- 比赛记录将在这里显示 -->
        </div>

        <div class="cta">
            <a href="27-competition-prep.html">查看比赛准备流程</a>
            <a href="30-achievements.html" class="secondary">查看成就系统</a>
        </div>

        <div class="next">
            <a href="../index.html">← 返回首页</a>
            <a href="27-competition-prep.html">比赛准备 →</a>
        </div>
    </div>

    <script>
        let matches = JSON.parse(localStorage.getItem('match-records') || '[]');

        // 初始化
        function init() {
            document.getElementById('match-date').value = new Date().toISOString().split('T')[0];
            renderMatches();
            updateStats();
        }

        // 添加比赛
        function addMatch() {
            const date = document.getElementById('match-date').value;
            const result = document.getElementById('match-result').value;
            const opponent = document.getElementById('match-opponent').value;
            const score = document.getElementById('match-score').value;
            const duration = document.getElementById('match-duration').value;
            const type = document.getElementById('match-type').value;
            const notes = document.getElementById('match-notes').value;
            
            if (!date || !opponent || !score) {
                alert('请填写日期、对手和比分');
                return;
            }
            
            const match = {
                id: Date.now(),
                date: date,
                result: result,
                opponent: opponent,
                score: score,
                duration: parseInt(duration) || 0,
                type: type,
                notes: notes,
                createdAt: new Date().toISOString()
            };
            
            matches.push(match);
            localStorage.setItem('match-records', JSON.stringify(matches));
            
            // 清空表单
            document.getElementById('match-opponent').value = '';
            document.getElementById('match-score').value = '';
            document.getElementById('match-duration').value = '';
            document.getElementById('match-notes').value = '';
            
            renderMatches();
            updateStats();
        }

        // 渲染比赛记录
        function renderMatches() {
            const recentMatches = matches.slice(-10).reverse();
            const listHtml = recentMatches.map(m => `
                <div class="match-item">
                    <div class="match-header">
                        <div class="match-date">${m.date} · ${m.type}</div>
                        <div class="match-result ${m.result}">${m.result === 'win' ? '胜利' : m.result === 'loss' ? '失败' : '平局'}</div>
                    </div>
                    <div class="match-players">vs ${m.opponent}</div>
                    <div class="match-score">${m.score}</div>
                    <div class="match-stats">
                        <div class="match-stat">
                            <div class="match-stat-value">${m.duration}分钟</div>
                            <div class="match-stat-label">比赛时长</div>
                        </div>
                        <div class="match-stat">
                            <div class="match-stat-value">${m.type}</div>
                            <div class="match-stat-label">比赛类型</div>
                        </div>
                        <div class="match-stat">
                            <div class="match-stat-value">${m.result === 'win' ? '✓' : m.result === 'loss' ? '✗' : '='}</div>
                            <div class="match-stat-label">结果</div>
                        </div>
                    </div>
                    ${m.notes ? `<div class="match-notes">📝 ${m.notes}</div>` : ''}
                </div>
            `).join('');
            
            document.getElementById('match-list').innerHTML = listHtml || '<p style="color:var(--text-2);text-align:center">暂无比赛记录</p>';
        }

        // 更新统计
        function updateStats() {
            const total = matches.length;
            const wins = matches.filter(m => m.result === 'win').length;
            const losses = matches.filter(m => m.result === 'loss').length;
            const winRate = total > 0 ? Math.round((wins / total) * 100) : 0;
            
            document.getElementById('stat-matches').textContent = total;
            document.getElementById('stat-win-rate').textContent = winRate + '%';
            document.getElementById('stat-win').textContent = wins;
            document.getElementById('stat-loss').textContent = losses;
        }

        init();
    </script>
</body>
</html>
