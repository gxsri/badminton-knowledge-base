<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术雷达图 — 羽毛球职业训练系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--surface:#18181b;--surface-2:#27272a;--border:#3f3f46;--text:#fafafa;--text-2:#a1a1aa;--accent:#f43f5e;--accent-2:#fb7185;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--yellow:#eab308;--indigo:#6366f1}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
        .back{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center}
        .back a{color:var(--text-2);text-decoration:none;font-size:0.9rem}.back a:hover{color:var(--text)}
        .content{max-width:800px;margin:0 auto;padding:6rem 2rem 4rem}
        .badge{display:inline-block;padding:0.3rem 0.8rem;background:rgba(168,85,247,0.15);border-radius:4px;font-size:0.8rem;color:var(--purple);font-family:'JetBrains Mono',monospace}
        h1{font-size:2.2rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3}
        .meta{color:var(--text-2);font-size:0.9rem;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
        h2{font-size:1.4rem;font-weight:700;margin:3rem 0 1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}
        p{margin-bottom:1rem;color:var(--text-2)}
        strong{color:var(--text)}
        .callout{background:var(--surface);border-left:3px solid var(--accent);padding:1.25rem 1.5rem;border-radius:0 8px 8px 0;margin:1.5rem 0}
        .callout p{margin:0;color:var(--text)}
        .callout.info{border-left-color:var(--blue)}
        .radar-container{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;margin:1.5rem 0;text-align:center}
        .radar-canvas{max-width:400px;margin:0 auto}
        .skills-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin:1.5rem 0}
        .skill-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem}
        .skill-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
        .skill-name{font-weight:600}
        .skill-score{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--accent)}
        .skill-bar{background:var(--bg);border-radius:4px;height:6px;overflow:hidden;margin-top:0.5rem}
        .skill-fill{height:100%;border-radius:4px;transition:width 0.3s}
        .skill-fill.excellent{background:var(--green)}
        .skill-fill.good{background:var(--blue)}
        .skill-fill.average{background:var(--yellow)}
        .skill-fill.weak{background:var(--accent)}
        .update-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin:1.5rem 0}
        .update-title{font-weight:600;margin-bottom:1rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
        .form-field{display:flex;flex-direction:column;gap:0.3rem}
        .form-field label{font-size:0.85rem;color:var(--text-2)}
        .form-field input,.form-field select{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.6rem 0.8rem;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none}
        .form-field input:focus,.form-field select:focus{border-color:var(--accent)}
        .btn{background:var(--accent);color:white;border:none;border-radius:6px;padding:0.7rem 1.5rem;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
        .btn:hover{background:var(--accent-2)}
        .cta{display:flex;gap:1rem;margin:3rem 0;flex-wrap:wrap}
        .cta a{flex:1;min-width:200px;padding:1rem;text-align:center;background:var(--accent);color:white;border-radius:8px;text-decoration:none;font-weight:600;transition:all 0.2s}
        .cta a:hover{background:var(--accent-2);transform:translateY(-2px)}
        .cta a.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
        .cta a.secondary:hover{background:var(--surface)}
        .next{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between}
        .next a{color:var(--accent);text-decoration:none;font-weight:500}
        .next a:hover{text-decoration:underline}
        @media(max-width:768px){
            .skills-grid{grid-template-columns:1fr}
            .form-row{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <div class="back"><a href="../index.html">← 返回首页</a></div>
    <div class="content">
        <div class="badge">技术评估</div>
        <h1>技术雷达图</h1>
        <div class="meta">可视化技术掌握程度 · 识别弱项 · 制定提升计划</div>

        <div class="callout info">
            <p><strong>什么是技术雷达？</strong>技术雷达是一个可视化工具，帮助你了解各项技术的掌握程度。通过定期评估，你可以清楚地看到自己的进步和需要加强的地方。</p>
        </div>

        <h2>📊 技术雷达图</h2>
        <div class="radar-container">
            <canvas id="radarChart" class="radar-canvas" width="400" height="400"></canvas>
        </div>

        <h2>📋 技术评分</h2>
        <div class="skills-grid" id="skills-grid">
            <!-- 技术评分将在这里显示 -->
        </div>

        <h2>✏️ 更新技术评分</h2>
        <div class="update-section">
            <div class="update-title">更新技术评分</div>
            <div class="form-row">
                <div class="form-field">
                    <label>技术项目</label>
                    <select id="skill-select">
                        <option value="clear">高远球</option>
                        <option value="drop">吊球</option>
                        <option value="smash">杀球</option>
                        <option value="net">网前技术</option>
                        <option value="backhand">反手技术</option>
                        <option value="footwork">步法</option>
                        <option value="defense">防守</option>
                        <option value="tactics">战术</option>
                    </select>
                </div>
                <div class="form-field">
                    <label>评分 (1-10)</label>
                    <input type="number" id="skill-score" min="1" max="10" value="5">
                </div>
            </div>
            <button class="btn" onclick="updateSkill()">更新评分</button>
        </div>

        <div class="cta">
            <a href="15-technique-analysis.html">查看技术全解析</a>
            <a href="05-level-2.html" class="secondary">查看Level 2训练</a>
        </div>

        <div class="next">
            <a href="../index.html">← 返回首页</a>
            <a href="15-technique-analysis.html">技术全解析 →</a>
        </div>
    </div>

    <script>
        // 技术数据
        let skills = JSON.parse(localStorage.getItem('skill-radar') || '{}');
        if (Object.keys(skills).length === 0) {
            skills = {
                clear: 5,
                drop: 4,
                smash: 3,
                net: 4,
                backhand: 3,
                footwork: 5,
                defense: 4,
                tactics: 3
            };
        }

        const skillNames = {
            clear: '高远球',
            drop: '吊球',
            smash: '杀球',
            net: '网前技术',
            backhand: '反手技术',
            footwork: '步法',
            defense: '防守',
            tactics: '战术'
        };

        // 绘制雷达图
        function drawRadar() {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 150;
            const skills = Object.keys(skills);
            const numSkills = skills.length;
            const angleStep = (2 * Math.PI) / numSkills;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景网格
            for (let i = 1; i <= 5; i++) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                for (let j = 0; j <= numSkills; j++) {
                    const angle = j * angleStep - Math.PI / 2;
                    const x = centerX + (radius * i / 5) * Math.cos(angle);
                    const y = centerY + (radius * i / 5) * Math.sin(angle);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // 绘制轴线
            for (let i = 0; i < numSkills; i++) {
                const angle = i * angleStep - Math.PI / 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 绘制数据
            ctx.beginPath();
            ctx.strokeStyle = 'var(--accent)';
            ctx.fillStyle = 'rgba(233, 63, 94, 0.2)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= numSkills; i++) {
                const idx = i % numSkills;
                const angle = idx * angleStep - Math.PI / 2;
                const value = skills[Object.keys(skills)[idx]] / 10;
                const x = centerX + radius * value * Math.cos(angle);
                const y = centerY + radius * value * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 绘制数据点
            for (let i = 0; i < numSkills; i++) {
                const angle = i * angleStep - Math.PI / 2;
                const value = skills[Object.keys(skills)[i]] / 10;
                const x = centerX + radius * value * Math.cos(angle);
                const y = centerY + radius * value * Math.sin(angle);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = 'var(--accent)';
                ctx.fill();
            }

            // 绘制标签
            ctx.fillStyle = '#a1a1aa';
            ctx.font = '12px Noto Sans SC';
            ctx.textAlign = 'center';
            for (let i = 0; i < numSkills; i++) {
                const angle = i * angleStep - Math.PI / 2;
                const x = centerX + (radius + 20) * Math.cos(angle);
                const y = centerY + (radius + 20) * Math.sin(angle);
                ctx.fillText(skillNames[Object.keys(skills)[i]], x, y);
            }
        }

        // 渲染技术评分
        function renderSkills() {
            const grid = document.getElementById('skills-grid');
            grid.innerHTML = Object.entries(skills).map(([key, value]) => {
                let levelClass = 'weak';
                if (value >= 8) levelClass = 'excellent';
                else if (value >= 6) levelClass = 'good';
                else if (value >= 4) levelClass = 'average';
                
                return `
                    <div class="skill-item">
                        <div class="skill-header">
                            <div class="skill-name">${skillNames[key]}</div>
                            <div class="skill-score">${value}/10</div>
                        </div>
                        <div class="skill-bar"><div class="skill-fill ${levelClass}" style="width:${value * 10}%"></div></div>
                    </div>
                `;
            }).join('');
        }

        // 更新技术评分
        function updateSkill() {
            const skill = document.getElementById('skill-select').value;
            const score = parseInt(document.getElementById('skill-score').value);
            
            if (score < 1 || score > 10) {
                alert('评分范围是1-10');
                return;
            }
            
            skills[skill] = score;
            localStorage.setItem('skill-radar', JSON.stringify(skills));
            
            drawRadar();
            renderSkills();
        }

        // 初始化
        drawRadar();
        renderSkills();
    </script>
</body>
</html>
