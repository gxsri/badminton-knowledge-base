<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{页面标题}} — 羽毛球职业训练系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#09090b;--surface:#18181b;--surface-2:#27272a;--border:#3f3f46;--text:#fafafa;--text-2:#a1a1aa;--accent:#f43f5e;--accent-2:#fb7185;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
        .back{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(9,9,11,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center}
        .back a{color:var(--text-2);text-decoration:none;font-size:0.9rem}.back a:hover{color:var(--text)}
        .content{max-width:800px;margin:0 auto;padding:6rem 2rem 4rem}
        .doc-badge{display:inline-block;padding:0.3rem 0.8rem;background:rgba(244,63,94,0.15);border-radius:4px;font-size:0.8rem;color:var(--accent);margin-bottom:1rem;font-family:'JetBrains Mono',monospace}
        h1{font-size:2.2rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3}
        .meta{color:var(--text-2);font-size:0.9rem;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
        h2{font-size:1.4rem;font-weight:700;margin:3rem 0 1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border)}
        h3{font-size:1.1rem;font-weight:600;margin:2rem 0 0.75rem;color:var(--accent-2)}
        p{margin-bottom:1rem;color:var(--text-2)}
        strong{color:var(--text)}
        .callout{background:var(--surface);border-left:3px solid var(--accent);padding:1.25rem 1.5rem;border-radius:0 8px 8px 0;margin:1.5rem 0}
        .callout p{margin:0;color:var(--text)}
        .callout.info{border-left-color:var(--blue)}
        .callout.warn{border-left-color:var(--orange)}
        .code-block{font-family:'JetBrains Mono',monospace;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.25rem;font-size:0.85rem;line-height:1.8;overflow-x:auto;margin:1.5rem 0;white-space:pre}
        .code-block .k{color:var(--accent)}.code-block .v{color:var(--green)}.code-block .c{color:var(--text-2)}
        table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:0.9rem}
        th,td{padding:0.75rem 1rem;text-align:left;border-bottom:1px solid var(--border)}
        th{background:var(--surface);font-weight:600;font-size:0.85rem}
        td{color:var(--text-2)}
        ul,ol{margin:1rem 0;padding-left:1.5rem;color:var(--text-2)}
        li{margin-bottom:0.5rem}
        .exercise{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin:1.5rem 0}
        .exercise-title{font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem}
        .exercise-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px}
        .next{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between}
        .next a{color:var(--accent);text-decoration:none;font-weight:500;font-size:0.95rem}
        .next a:hover{text-decoration:underline}
        /* 动作示范画廊（素材 © Gym visual — gymvisual.com，180×180） */
        .demo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin:1.5rem 0}
        .demo-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
        .demo-media{background:#000;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
        .demo-media img{max-width:100%;max-height:100%;display:block}
        .demo-name{padding:.65rem .9rem;font-size:.9rem;font-weight:600;line-height:1.4}
        .demo-name small{display:block;color:var(--text-2);font-weight:400;font-size:.72rem;margin-top:.1rem}
        .demo-credit{font-size:.8rem;color:var(--text-2);margin-top:.5rem}
        @media(max-width:768px){.content{padding:5.5rem 1.25rem 3rem}}
    </style>
</head>
<body>
    <div class="back"><a href="../index.html">← 返回首页</a></div>
    <div class="content">
        <div class="doc-badge">{{编号}}</div>
        <h1>{{页面标题}}</h1>
        <div class="meta">{{适用对象与副标题}}</div>

        <!-- ===== 正文从这里开始 ===== -->

        <div class="next">
            <a href="{{前一篇文件}}">← {{前一篇标题}}</a>
            <a href="{{后一篇文件}}">{{后一篇标题}} →</a>
        </div>
    </div>
</body>
</html>
