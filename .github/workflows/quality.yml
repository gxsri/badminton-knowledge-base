name: Quality Gate

# 内容与站点质量的自动门禁：
# 任何 push / PR 都会跑静态回归（60+ 项检查：登记表、结构、链接、内容标准 v2、文风红线、素材台账、SEO…）
# 失败即红灯，配合 deploy.yml 阻止不合规内容上线。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check shared assets
        run: |
          node --check assets/site-ui.js
          node --check assets/simple-mode.js

      - name: Static regression (structure / links / content standard / assets ledger)
        run: node tests/regression.mjs

      - name: "Content review (per-tier semantics: 动作/强度/频率/恢复/时长上限/进阶触发)"
        run: node scripts/review-content.mjs
