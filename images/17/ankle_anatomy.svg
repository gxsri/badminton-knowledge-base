<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <rect width="700" height="500" fill="#0f172a" rx="8"/>
  <text x="350" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">踝关节解剖(外侧面)</text>
<rect x="310" y="40" width="30" height="110" rx="5" fill="#94a3b8" fill-opacity="0.3" stroke="#e2e8f0" stroke-width="1.5"/><text x="325" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">胫骨</text><rect x="340" y="50" width="20" height="100" rx="4" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1.5"/><text x="350" y="95" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">腓骨</text><polygon points="310,150 350,150 355,175 305,175" fill="#e2e8f0" fill-opacity="0.3" stroke="#e2e8f0" stroke-width="1.5"/><text x="330" y="168" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">距骨</text><path d="M 305 175 L 295 220 Q 310 230 330 220 L 345 175" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="320" y="210" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">跟骨</text><path d="M 320 85 L 310 215" stroke="#ef4444" stroke-width="3"/><text x="295" y="140" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="end">跟腱</text><path d="M 345 90 L 330 160" stroke="#f59e0b" stroke-width="2.5"/><text x="350" y="125" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="start">距腓前韧带(ATFL)</text><path d="M 342 140 L 310 205" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,2"/><text x="350" y="180" fill="#a78bfa" font-family="sans-serif" font-size="8" text-anchor="start">跟腓韧带(CFL)</text><path d="M 350 60 L 345 160" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3"/><text x="360" y="100" fill="#22c55e" font-family="sans-serif" font-size="8" text-anchor="start">腓骨长短肌</text><rect x="40" y="360" width="620" height="120" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="50" y="380" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="start">• 羽毛球踝关节扭伤90%为内翻损伤 (距腓前韧带最先受伤)</text><text x="50" y="402" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="start">• ATFL是踝关节外侧最薄弱的韧带, 也是最常撕裂的</text><text x="50" y="424" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="start">• 腓骨长短肌是防止踝内翻的主要动力性稳定结构</text><text x="50" y="446" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="start">• POLICE原则: 保护→适当负荷→冰敷→加压→抬高</text></svg>