<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="700" height="550">
  <rect width="700" height="550" fill="#0f172a" rx="8"/>
  <text x="350" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">下交叉综合征——骨盆前倾</text>
<ellipse cx="350" cy="270" rx="75" ry="170" fill="none" stroke="#475569" stroke-width="1.5"/><rect x="310" y="230" width="100" height="35" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/><text x="360" y="250" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">髂腰肌+股直肌(紧)</text><rect x="320" y="170" width="90" height="35" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/><text x="365" y="190" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">竖脊肌腰部(紧)</text><rect x="400" y="215" width="80" height="35" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/><text x="440" y="232" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="middle">腹肌(弱)</text><rect x="370" y="320" width="80" height="35" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/><text x="410" y="337" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="middle">臀大肌(弱)</text><path d="M 350 300 L 380 270" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/><text x="385" y="270" fill="#ef4444" font-family="sans-serif" font-size="10">骨盆前倾→</text><defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker></defs><rect x="30" y="400" width="640" height="130" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="40" y="420" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">后果：</text><text x="40" y="445" fill="#94a3b8" font-family="sans-serif" font-size="10">• 下背痛</text><text x="40" y="467" fill="#94a3b8" font-family="sans-serif" font-size="10">• 腘绳肌代偿性紧张(骨盆前倾拉长腘绳肌)</text><text x="40" y="489" fill="#94a3b8" font-family="sans-serif" font-size="10">• 髋关节活动度下降</text></svg>