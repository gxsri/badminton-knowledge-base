    <path d="M 195 780 L 210 700 Q 220 600 230 500 Q 240 400 260 250 Q 280 175 280 150" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,4"/><text x="290" y="580" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="start">后表线(SBL)</text><path d="M 200 790 L 200 700 Q 210 600 220 500 Q 230 380 240 250 Q 255 175 265 155" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="8,4"/><text x="100" y="450" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="start">前表线(SFL)</text><path d="M 200 780 L 195 670 Q 190 550 195 400 Q 200 250 180 200 Q 140 150 110 120" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4,4"/><text x="90" y="180" fill="#22c55e" font-family="sans-serif" font-size="9" text-anchor="start">侧线(LL)</text><path d="M 280 155 Q 200 180 120 280 Q 140 350 190 380 Q 240 400 280 350" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2,4"/><text x="285" y="350" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="start">螺旋线(SpL)</text><path d="M 230 220 L 160 280 Q 120 340 110 430" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6,3"/><text x="115" y="400" fill="#a78bfa" font-family="sans-serif" font-size="9" text-anchor="start">臂前线(AFL)</text><rect x="360" y="130" width="220" height="200" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="370" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="start">筋膜经线说明：</text><text x="370" y="175" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="start">━━ 后表线(SBL)</text><text x="370" y="188" fill="#94a3b8" font-family="sans-serif" font-size="7.5" text-anchor="start">足底→跟腱→腘绳肌→竖脊肌→头顶</text><text x="370" y="205" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="start">━━ 前表线(SFL)</text><text x="370" y="218" fill="#94a3b8" font-family="sans-serif" font-size="7.5" text-anchor="start">足背→胫前肌→股直肌→腹直肌→颈</text><text x="370" y="235" fill="#22c55e" font-family="sans-serif" font-size="9" text-anchor="start">━━ 侧线(LL)</text><text x="370" y="248" fill="#94a3b8" font-family="sans-serif" font-size="7.5" text-anchor="start">腓骨肌→髂胫束→腹斜肌→肋间肌→颈</text><text x="370" y="265" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="start">━━ 螺旋线(SpL)</text><text x="370" y="278" fill="#94a3b8" font-family="sans-serif" font-size="7.5" text-anchor="start">头夹肌→菱形肌→前锯肌→腹斜肌→胫前肌</text><text x="370" y="295" fill="#a78bfa" font-family="sans-serif" font-size="9" text-anchor="start">━━ 臂前线(AFL)</text><text x="370" y="308" fill="#94a3b8" font-family="sans-serif" font-size="7.5" text-anchor="start">胸大肌→肱二头肌→前臂屈肌→手掌</text></svg>