<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <rect width="800" height="550" fill="#0f172a" rx="8"/>
  <text x="400" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">肩袖四肌——包裹肱骨头的稳定系统</text>
<ellipse cx="320" cy="280" rx="30" ry="45" fill="#475569" fill-opacity="0.3" stroke="#64748b" stroke-width="2"/><text x="320" y="275" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">关节盂</text><circle cx="400" cy="280" r="32" fill="#334155" stroke="#64748b" stroke-width="2"/><text x="400" y="275" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">肱骨头</text><rect x="395" y="312" width="10" height="100" fill="#334155" stroke="#64748b" stroke-width="1.5"/><rect x="360" y="235" width="55" height="28" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/><text x="387" y="249" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">冈上肌</text><text x="387" y="259" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">外展0-30°</text><rect x="435" y="255" width="55" height="28" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/><text x="462" y="269" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">冈下肌</text><text x="462" y="279" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle">外旋</text><rect x="440" y="290" width="55" height="28" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/><text x="467" y="304" fill="#22c55e" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">小圆肌</text><text x="467" y="314" fill="#22c55e" font-family="sans-serif" font-size="8" text-anchor="middle">外旋+内收</text><rect x="360" y="310" width="55" height="28" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="387" y="324" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">肩胛下肌</text><text x="387" y="334" fill="#3b82f6" font-family="sans-serif" font-size="8" text-anchor="middle">内旋</text><rect x="530" y="80" width="240" height="440" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="540" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">核心作用：</text><text x="540" y="125+0" fill="#94a3b8" font-family="sans-serif" font-size="10">肩袖不是"发力"肌肉——</text><text x="540" y="125+18" fill="#94a3b8" font-family="sans-serif" font-size="10">它是"稳定"的肌肉。</text><text x="540" y="125+36" fill="#94a3b8" font-family="sans-serif" font-size="10"></text><text x="540" y="125+54" fill="#94a3b8" font-family="sans-serif" font-size="10">作用：手臂快速运动时</text><text x="540" y="125+72" fill="#94a3b8" font-family="sans-serif" font-size="10">把肱骨头稳定在关节盂里。</text><text x="540" y="125+90" fill="#94a3b8" font-family="sans-serif" font-size="10"></text><text x="540" y="125+108" fill="#94a3b8" font-family="sans-serif" font-size="10">杀球时肩内旋速度：</text><text x="540" y="125+126" fill="#94a3b8" font-family="sans-serif" font-size="10">7000°/秒</text><text x="540" y="125+144" fill="#94a3b8" font-family="sans-serif" font-size="10"></text><text x="540" y="125+162" fill="#94a3b8" font-family="sans-serif" font-size="10">肩袖不稳定→</text><text x="540" y="125+180" fill="#94a3b8" font-family="sans-serif" font-size="10">• 肱骨头撞击肩峰</text><text x="540" y="125+198" fill="#94a3b8" font-family="sans-serif" font-size="10">  → 肩峰下撞击综合征</text><text x="540" y="125+216" fill="#94a3b8" font-family="sans-serif" font-size="10">• 肌腱过度摩擦</text><text x="540" y="125+234" fill="#94a3b8" font-family="sans-serif" font-size="10">  → 肩袖肌腱炎</text><text x="540" y="125+252" fill="#94a3b8" font-family="sans-serif" font-size="10">• 关节囊被牵拉</text><text x="540" y="125+270" fill="#94a3b8" font-family="sans-serif" font-size="10">  → 肩关节不稳</text></svg>