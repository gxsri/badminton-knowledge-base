<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <rect width="600" height="900" fill="#0f172a" rx="8"/>
  <text x="300" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">全身肌肉正面视图</text>

    <!-- Head -->
    <ellipse cx="250" cy="110" rx="40" ry="50" fill="none" stroke="#475569" stroke-width="1.5"/>
    <circle cx="250" cy="95" r="3" fill="#475569"/>
    <path d="M 233 105 Q 240 112 248 108" fill="none" stroke="#475569" stroke-width="1"/>
    <path d="M 267 105 Q 260 112 252 108" fill="none" stroke="#475569" stroke-width="1"/>
    <!-- Neck -->
    <rect x="230" y="155" width="40" height="30" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Torso -->
    <path d="M 180 185 L 180 480 Q 180 500 200 500 L 300 500 Q 320 500 320 480 L 320 185" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Arms -->
    <path d="M 180 200 L 100 320 L 85 450" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M 320 200 L 400 320 L 415 450" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Hands -->
    <ellipse cx="82" cy="460" rx="15" ry="10" fill="none" stroke="#475569" stroke-width="1"/>
    <ellipse cx="418" cy="460" rx="15" ry="10" fill="none" stroke="#475569" stroke-width="1"/>
    <!-- Legs -->
    <path d="M 210 500 L 190 700 L 175 830" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M 290 500 L 310 700 L 325 830" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Feet -->
    <path d="M 155 830 L 175 830 L 190 840" fill="none" stroke="#475569" stroke-width="1.5"/>
    <path d="M 345 830 L 325 830 L 310 840" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Waist line -->
    <line x1="180" y1="380" x2="320" y2="380" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Center line -->
    <line x1="250" y1="185" x2="250" y2="830" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="225" y="165" width="50" height="18" rx="4" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1"/><text x="250" y="179" fill="#a78bfa" font-family="sans-serif" font-size="8" text-anchor="middle">胸锁乳突肌</text><rect x="125" y="210" width="50" height="25" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/><text x="150" y="224" fill="#3b82f6" font-family="sans-serif" font-size="8" text-anchor="middle">三角肌(前束)</text><rect x="185" y="210" width="60" height="55" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/><text x="215" y="224" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">胸大肌</text><rect x="105" y="250" width="40" height="60" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/><text x="125" y="264" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle">肱二头肌</text><rect x="335" y="250" width="40" height="50" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/><text x="355" y="264" fill="#22c55e" font-family="sans-serif" font-size="8" text-anchor="middle">肱三头肌</text><rect x="90" y="330" width="40" height="60" rx="4" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/><text x="110" y="344" fill="#f97316" font-family="sans-serif" font-size="8" text-anchor="middle">前臂屈肌群</text><rect x="200" y="255" width="100" height="80" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/><text x="250" y="269" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">腹直肌</text><rect x="175" y="290" width="30" height="80" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/><text x="190" y="304" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle">腹外斜肌</text><rect x="175" y="240" width="20" height="50" rx="4" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1"/><text x="185" y="254" fill="#a78bfa" font-family="sans-serif" font-size="8" text-anchor="middle">前锯肌</text><rect x="195" y="395" width="110" height="110" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/><text x="250" y="409" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="middle">股四头肌</text><rect x="190" y="410" width="40" height="90" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/><text x="210" y="424" fill="#f59e0b" font-family="sans-serif" font-size="8" text-anchor="middle">缝匠肌</text><rect x="200" y="490" width="60" height="60" rx="4" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1"/><text x="230" y="504" fill="#a78bfa" font-family="sans-serif" font-size="8" text-anchor="middle">内收肌群</text><rect x="185" y="590" width="35" height="80" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/><text x="202" y="604" fill="#3b82f6" font-family="sans-serif" font-size="8" text-anchor="middle">胫骨前肌</text><rect x="200" y="670" width="30" height="60" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/><text x="215" y="684" fill="#22c55e" font-family="sans-serif" font-size="8" text-anchor="middle">腓肠肌</text><text x="370" y="230" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="start">1. 胸大肌 - 杀球主要发力肌</text><text x="370" y="245" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="start">2. 三角肌前束 - 架拍抬臂</text><text x="370" y="260" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="start">3. 腹直肌 - 核心稳定</text><text x="370" y="275" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="start">4. 股四头肌 - 弓步前腿</text><text x="370" y="290" fill="#3b82f6" font-family="sans-serif" font-size="9" text-anchor="start">5. 胫骨前肌 - 落地缓冲</text><text x="370" y="305" fill="#22c55e" font-family="sans-serif" font-size="9" text-anchor="start">6. 腓肠肌 - 启动蹬地</text></svg>