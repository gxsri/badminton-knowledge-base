<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#0f172a" rx="8"/>
  <text x="450" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold">牵涉痛机制——脊髓节段"串线"现象</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect x="350" y="80" width="200" height="350" rx="10" fill="#334155" fill-opacity="0.3" stroke="#475569" stroke-width="1.5"/><text x="450" y="110" fill="#e2e8f0" font-family="sans-serif" font-size="12" text-anchor="middle">脊髓(C5-C6节段)</text><rect x="380" y="140" width="140" height="60" rx="4" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1"/><text x="450" y="165" fill="#a78bfa" font-family="sans-serif" font-size="10" text-anchor="middle">后角(痛觉交汇区)</text><path d="M 100 280 L 380 170" fill="none" stroke="#ef4444" stroke-width="2"/><circle cx="100" cy="280" r="30" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/><text x="100" y="275" fill="#ef4444" font-family="sans-serif" font-size="10" text-anchor="middle">冈下肌</text><text x="100" y="290" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">(激痛点)</text><path d="M 100 120 L 380 160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/><circle cx="100" cy="120" r="30" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/><text x="100" y="115" fill="#f59e0b" font-family="sans-serif" font-size="10" text-anchor="middle">肩前侧</text><text x="100" y="130" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle">(正常信号)</text><line x1="450" y1="140" x2="450" y2="60" stroke="#e2e8f0" stroke-width="2" marker-end="url(#a)"/><ellipse cx="450" cy="45" rx="30" ry="20" fill="#e2e8f0" fill-opacity="0.1" stroke="#e2e8f0" stroke-width="1"/><text x="450" y="48" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">大脑</text><text x="600" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">关键原理：</text><text x="600" y="152" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• 冈下肌痛觉信号→脊髓C5-C6节段</text><text x="600" y="174" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• 同一节段也接收肩前侧的信号</text><text x="600" y="196" fill="#94a3b8" font-family="sans-serif" font-size="10.5">• 大脑分不清信号到底来自哪里</text><text x="600" y="218" fill="#f59e0b" font-family="sans-serif" font-size="10.5">• 告诉你"肩前侧痛"</text><text x="600" y="240" fill="#ef4444" font-family="sans-serif" font-size="10.5">• ——问题实际在肩后侧的冈下肌</text><text x="600" y="262" fill="#94a3b8" font-family="sans-serif" font-size="10.5"></text><text x="600" y="284" fill="#f59e0b" font-family="sans-serif" font-size="10.5">• 临床意义：患者说肩前侧痛→</text><text x="600" y="306" fill="#22c55e" font-family="sans-serif" font-size="10.5">• 不要只查前面，查冈下肌和小圆肌</text></svg>