    <rect x="230" y="85" width="40" height="40" rx="3" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1"/><text x="250" y="108" fill="#94a3b8" font-family="sans-serif" font-size="6.5" text-anchor="middle">颅骨</text><rect x="175" y="195" width="100" height="12" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="225" y="204" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">锁骨</text><rect x="165" y="210" width="30" height="55" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="180" y="240" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">肩胛骨</text><rect x="120" y="245" width="20" height="80" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="130" y="288" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">肱骨</text><rect x="105" y="335" width="15" height="65" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="112" y="370" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">桡骨</text><rect x="120" y="335" width="15" height="65" rx="3" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1"/><text x="127" y="370" fill="#94a3b8" font-family="sans-serif" font-size="6.5" text-anchor="middle">尺骨</text><rect x="230" y="210" width="40" height="55" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="250" y="240" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">胸骨</text><rect x="180" y="220" width="80" height="60" rx="3" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1"/><text x="220" y="253" fill="#94a3b8" font-family="sans-serif" font-size="6.5" text-anchor="middle">肋骨</text><rect x="240" y="160" width="20" height="180" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="250" y="253" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">脊柱(颈椎+)</text><rect x="200" y="355" width="100" height="40" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="250" y="378" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">骨盆</text><rect x="190" y="410" width="30" height="150" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="205" y="488" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">股骨</text><rect x="220" y="540" width="20" height="18" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="230" y="552" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">髌骨</text><rect x="195" y="565" width="25" height="120" rx="3" fill="#e2e8f0" fill-opacity="0.2" stroke="#e2e8f0" stroke-width="1"/><text x="207" y="628" fill="#e2e8f0" font-family="sans-serif" font-size="6.5" text-anchor="middle">胫骨</text><rect x="220" y="575" width="15" height="105" rx="3" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1"/><text x="227" y="630" fill="#94a3b8" font-family="sans-serif" font-size="6.5" text-anchor="middle">腓骨</text><rect x="185" y="710" width="60" height="40" rx="3" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="1"/><text x="215" y="733" fill="#94a3b8" font-family="sans-serif" font-size="6.5" text-anchor="middle">足骨</text><text x="340" y="215" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">锁骨 - 手臂悬挂点</text><text x="340" y="235" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">肩胛骨 - 肩关节底座</text><text x="340" y="255" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">肱骨 - 上臂骨</text><text x="340" y="275" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">桡骨+尺骨 - 前臂</text><text x="340" y="295" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">骨盆 - 核心底座</text><text x="340" y="315" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">股骨 - 大腿骨</text><text x="340" y="335" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">髌骨 - 膝盖骨</text><text x="340" y="355" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="start">胫骨+腓骨 - 小腿</text></svg>